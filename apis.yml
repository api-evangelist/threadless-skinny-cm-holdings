name: Threadless ( Skinny CM Holdings)
description: >-
  Threadless (operated by Skinny CM Holdings) is an online design community and
  print-on-demand apparel marketplace founded in 2000 in Chicago. Artists and
  designers submit artwork, the community scores and votes on submissions, and
  winning designs are printed on t-shirts, apparel, wall art, home goods, and
  accessories sold through the site. Threadless also runs Artist Shops, free
  hosted storefronts that let independent creators sell their designs on a
  print-on-demand basis without holding inventory. Surfaced as a portfolio
  company of Insight Partners and added to the API Evangelist network for
  enrichment; no public developer API surface was reachable during this pass
  (the storefront aggressively blocks automated access).
